name: Cross-platform compile check

# 只做编译门禁，不出安装包：提前发现把 Windows API 写进公共代码的问题。
# 发版仍由 build-release.yml 在 v* tag 上单独负责。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cargo-check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Tauri 2 在 Linux 上编译需要 WebKitGTK 与 AppIndicator 等系统库
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml
