name: Build and Release

# 打 v* 格式的 tag 自动构建 Windows 安装包并发布到 Release
# 用法：git tag -a v0.1.0 -m "version 0.1.0" && git push origin v0.1.0
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # windows-latest 自带 MSVC 与 Windows SDK，CI 里无需 MSYS2/MinGW
      - name: Build and create release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'RunHelp __VERSION__'
          releaseBody: |
            Windows 安装包（NSIS），下载后直接安装即可。

            国内访问 GitHub 慢的用户，可到 GitCode / Gitee 镜像仓库的「发行版」下载同一安装包。
          releaseDraft: true
          prerelease: false
