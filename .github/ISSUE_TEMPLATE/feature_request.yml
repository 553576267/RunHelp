name: 功能建议
description: 提出新功能或改进建议
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 描述你遇到的实际场景或痛点，而不是直接给方案
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 希望软件怎么运作，最好描述交互流程
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: 涉及模块
      options:
        - 项目管理
        - 命令中心
        - 流水线
        - 图片压缩
        - 脚本管理
        - 备份与恢复
        - 界面与主题
        - 其他
    validations:
      required: true

  - type: textarea
    id: alternative
    attributes:
      label: 替代方案
      description: 有没有其他可达到同样目的的做法
