name: Sync mirrors

# GitCode 是主仓：日常只 push 到这里，本流水线单向同步到 GitHub 和 Gitee。
# 单向同步不需要 [skip sync] 防循环标记，稳定得多。
#
# 配置步骤：GitCode 仓库 → 设置 → 密钥变量（Secrets）新增四项：
#   GH_TOKEN        GitHub Personal Access Token，勾选 repo 权限（经典 PAT）；
#                   若用 Fine-grained token，用户名处改为 x-access-token
#   GH_USERNAME     GitHub 用户名
#   GITEE_TOKEN     Gitee 私人令牌，勾选 projects 权限
#   GITEE_USERNAME  Gitee 用户名
#
# 注意：GitHub / Gitee 上的同名仓库需提前建好且为空（不要初始化 README）。
on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: gitcode/checkout@v2
        with:
          fetch-depth: 0

      - name: Sync to GitHub
        env:
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git remote add github "https://${GH_USERNAME}:${GH_TOKEN}@github.com/${GH_USERNAME}/RunHelp.git"
          git push github "HEAD:refs/heads/main" --force
          git push github --tags --force

      - name: Sync to Gitee
        env:
          GITEE_USERNAME: ${{ secrets.GITEE_USERNAME }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          git remote add gitee "https://${GITEE_USERNAME}:${GITEE_TOKEN}@gitee.com/${GITEE_USERNAME}/RunHelp.git"
          git push gitee "HEAD:refs/heads/master" --force
          git push gitee --tags --force
